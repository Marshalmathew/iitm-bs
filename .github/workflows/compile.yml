name: Compile LaTeX Textbooks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      courses: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            maths1: maths1/**
            maths2: maths2/**
            python: python/**
            stats1: stats1/**
            stats2: stats2/**

  build:
    needs: changes
    if: ${{ needs.changes.outputs.courses != '[]' && needs.changes.outputs.courses != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        course: ${{ fromJSON(needs.changes.outputs.courses) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-pictures texlive-xetex qrencode

      - name: Compile LaTeX Document
        run: |
          cd ${{ matrix.course }}
          xelatex -interaction=nonstopmode main.tex || true
          if [ -f main.idx ]; then makeindex main.idx; fi
          xelatex -halt-on-error -interaction=nonstopmode main.tex

      - name: Verify PDF Generation
        run: |
          if [ ! -f ${{ matrix.course }}/main.pdf ]; then
            echo "Error: main.pdf was not generated for ${{ matrix.course }}"
            cat ${{ matrix.course }}/main.log | tail -n 50
            exit 1
          fi

      - name: Upload Individual PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.course }}-textbook
          path: ${{ matrix.course }}/main.pdf

  commit-pdfs:
    needs: [changes, build]
    if: ${{ success() && needs.changes.outputs.courses != '[]' && needs.changes.outputs.courses != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          
      - name: Download New PDF Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-pdfs

      - name: Organize PDFs into Repo
        run: |
          mkdir -p compiled_pdfs
          # Only copy the ones that were just built and downloaded
          for course in maths1 maths2 python stats1 stats2; do
            if [ -f "downloaded-pdfs/${course}-textbook/main.pdf" ]; then
              echo "Updating PDF for ${course}..."
              cp "downloaded-pdfs/${course}-textbook/main.pdf" "compiled_pdfs/${course}.pdf"
            fi
          done

      - name: Commit and Push PDFs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update compiled PDFs [skip ci]"
          file_pattern: "compiled_pdfs/*.pdf"
